name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04  # 使用 Ubuntu 22.04 (24.04 有 Buildozer 兼容问题)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev \
            cmake libffi-dev libssl-dev \
            python3-setuptools patchelf \
            libncurses5-dev libncursesw5-dev
          pip3 install --upgrade pip
          pip3 install buildozer cython

      - name: Build APK with Buildozer
        run: |
          buildozer android debug
        env:
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25c

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-player-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev cmake \
            libffi-dev libssl-dev python3-setuptools patchelf \
            libncurses5 libncurses-dev curl wget
          pip3 install --upgrade pip -q
          pip3 install 'buildozer<2' 'cython<3' -q

      - name: Build APK
        run: |
          # Export env vars
          export ANDROIDSDK="/home/runner/.buildozer/android/platform/android-sdk"
          export ANDROIDNDK="/home/runner/.buildozer/android/platform/android-ndk-r25c"
          export CFLAGS="-Wno-error=implicit-function-declaration"
          export CXXFLAGS="-Wno-error=implicit-function-declaration"
          export LC_ALL="C.UTF-8"

          # First build attempt - will generate dist files
          echo "=== First build attempt ==="
          buildozer android debug 2>&1 || echo "BUILD_FAILED_EXPECTED"

          # Patch the p4a IndexError bug in ALL generated build.py files
          echo "=== Patching p4a IndexError bug ==="
          find .buildozer -name "build.py" -type f 2>/dev/null | while read f; do
            if grep -q "entrypoint = spec\[1\]" "$f" 2>/dev/null; then
              echo "Patching: $f"
              sed -i 's/entrypoint = spec\[1\]/entrypoint = spec[0] if len(spec) > 0 else entry_point/g' "$f"
            fi
            if grep -q "entrypoint = spec\[1\]" "$f" 2>/dev/null; then
              echo "Patch may have failed on: $f"
            else
              echo "OK: $f"
            fi
          done

          # Second build attempt with patched files
          echo "=== Second build attempt ==="
          buildozer android debug 2>&1

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-player-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

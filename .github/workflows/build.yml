name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev cmake \
            libffi-dev libssl-dev python3-setuptools patchelf \
            libncurses5 libncurses-dev
          pip3 install --upgrade pip -q
          pip3 install 'buildozer<2' 'cython<3' python-for-android -q

      - name: Patch ALL p4a sources
        run: |
          echo "=== Patching entrypoint = spec[1] bug in ALL locations ==="
          # The fix changes: entrypoint = spec[1] 
          # To: entrypoint = spec[0] if len(spec) > 0 else "main"
          FIX_CMD="s/entrypoint = spec\[1\]/entrypoint = spec[0] if len(spec) > 0 else 'main'/g"
          
          # 1. Patch pip-installed p4a
          echo "--- Pip location ---"
          P4A_PIP=$(python3 -c "import pythonforandroid; print(pythonforandroid.__file__)" 2>/dev/null | xargs dirname)
          if [ -n "$P4A_PIP" ]; then
            find "$P4A_PIP" -name "*.py" -type f -exec grep -l "entrypoint = spec\[1\]" {} \; 2>/dev/null | while read f; do
              echo "PIP-PATCH: $f"
              sed -i "$FIX_CMD" "$f"
            done
          fi
          
          # 2. Patch any existing .buildozer (from cache)
          echo "--- .buildozer location ---"
          if [ -d ".buildozer" ]; then
            find .buildozer -name "*.py" -type f -exec grep -l "entrypoint = spec\[1\]" {} \; 2>/dev/null | while read f; do
              echo "BUILD-PATCH: $f"
              sed -i "$FIX_CMD" "$f"
            done
          fi
          
          # 3. Patch all Python site-packages
          echo "--- site-packages ---"
          for pkgdir in /home/runner/.local /usr/local /usr /opt; do
            find "$pkgdir" -path "*/pythonforandroid/*" -name "*.py" -type f -exec grep -l "entrypoint = spec\[1\]" {} \; 2>/dev/null | while read f; do
              echo "PKG-PATCH: $f"
              sed -i "$FIX_CMD" "$f"
            done
          done
          
          echo "=== Patch complete ==="

      - name: Build APK
        run: |
          export ANDROIDSDK="/home/runner/.buildozer/android/platform/android-sdk"
          export ANDROIDNDK="/home/runner/.buildozer/android/platform/android-ndk-r25c"
          export CFLAGS="-Wno-error=implicit-function-declaration"
          export CXXFLAGS="-Wno-error=implicit-function-declaration"
          export LC_ALL="C.UTF-8"
          
          # Phase 1: Let buildozer download p4a + SDK + NDK (will fail at IndexError)
          echo "=== Phase 1: Initialize build environment ==="
          buildozer android debug 2>&1 || echo "PHASE1_DONE"
          
          # Phase 2: Patch p4a template in buildozer's own directory
          echo "=== Phase 2: Patch p4a template (the ACTUAL source) ==="
          P4A_DIR=".buildozer/android/platform/python-for-android"
          if [ -d "$P4A_DIR" ]; then
            find "$P4A_DIR" -name "*.py" -type f | while read f; do
              if grep -q 'entrypoint = spec\[1\]' "$f" 2>/dev/null; then
                echo "PATCHING source: $f"
                sed -i 's/entrypoint = spec\[1\]/entrypoint = spec[0] if len(spec) > 0 else "main"/g' "$f"
              fi
            done
          fi
          
          # Phase 3: Remove the buggy generated build.py so p4a regenerates it
          echo "=== Phase 3: Clear generated dist files ==="
          find .buildozer -path "*/dists/*" -name "build.py" -type f 2>/dev/null | while read f; do
            echo "REMOVE: $f"
            rm -f "$f"
          done
          
          # Phase 4: Rebuild with patched p4a
          echo "=== Phase 4: Rebuild APK ==="
          buildozer android debug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-player-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30

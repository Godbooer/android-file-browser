name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool \
            pkg-config zlib1g-dev \
            cmake libffi-dev libssl-dev \
            python3-setuptools patchelf \
            libncurses5-dev libncursesw5-dev
          pip3 install --upgrade pip
          pip3 install 'buildozer<2' 'cython<3'

      - name: Build APK with Buildozer
        run: |
          buildozer android debug 2>&1 || true
          # Patch p4a bug: entrypoint = spec[1] when spec has < 2 elements
          echo "Patching p4a generated build.py files..."
          find .buildozer -name "build.py" -exec \
            sed -i 's/entrypoint = spec\[1\]/entrypoint = spec[0] if len(spec) > 0 else "main"/g' {} \; 2>/dev/null || true
          # Retry after patching
          echo "Retrying build after p4a patch..."
          buildozer android debug
        env:
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25c
          CFLAGS: '-Wno-error=implicit-function-declaration'
          CXXFLAGS: '-Wno-error=implicit-function-declaration'
          LC_ALL: 'C.UTF-8'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-player-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

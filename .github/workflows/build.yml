name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev cmake \
            libffi-dev libssl-dev python3-setuptools patchelf \
            libncurses5 libncurses-dev curl wget
          pip3 install --upgrade pip -q
          pip3 install 'buildozer<2' 'cython<3' -q

      - name: Install and patch python-for-android
        run: |
          # Install p4a explicitly so we can patch it BEFORE buildozer uses it
          pip3 install python-for-android 2>&1 | tail -3
          
          # Find and fix the IndexError bug in p4a's bootstrap template
          echo "=== Patching p4a source ==="
          P4A_DIR=$(python3 -c "import pythonforandroid; import os; print(os.path.dirname(pythonforandroid.__file__))" 2>/dev/null)
          echo "p4a location: $P4A_DIR"
          
          if [ -n "$P4A_DIR" ]; then
            # Fix the entrypoint bug in the template
            find "$P4A_DIR" -name "build.py" -path "*/bootstraps/*" | while read f; do
              if grep -q "entrypoint = spec\[1\]" "$f" 2>/dev/null; then
                echo "PATCHING: $f"
                sed -i 's/entrypoint = spec\[1\]/entrypoint = spec[0] if len(spec) > 0 else "main"/g' "$f"
                grep "entrypoint = spec" "$f" | head -3
              fi
            done
            echo "=== Patch complete ==="
          else
            echo "WARNING: Could not find p4a source directory"
          fi

      - name: Build APK
        run: |
          export ANDROIDSDK="/home/runner/.buildozer/android/platform/android-sdk"
          export ANDROIDNDK="/home/runner/.buildozer/android/platform/android-ndk-r25c"
          export CFLAGS="-Wno-error=implicit-function-declaration"
          export CXXFLAGS="-Wno-error=implicit-function-declaration"
          export LC_ALL="C.UTF-8"
          
          buildozer android debug

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-player-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 30
